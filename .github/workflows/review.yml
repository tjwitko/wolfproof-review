name: wolfproof review

# A comment-only review of a pull request: wolfproof scans the repository, a script sorts its findings
# by whether the pull request touched them, and a model comments on the lines the pull request changed.
# It never fails the build. Call it from a workflow of your own (see the README):
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#   permissions:
#     contents: read
#     pull-requests: write
#   jobs:
#     wolfproof-review:
#       uses: tjwitko/wolfproof-review/.github/workflows/review.yml@v0.3.4
#       secrets:
#         REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
#
# Two jobs, so the job that runs the project's code never holds the API key. `scan` runs wolfproof,
# which runs the project's tests and builds, with no secrets and a read-only token. `review` runs no
# project code: it reads the pull request as files, and the model may only read, search and comment.

on:
  workflow_call:
    inputs:
      provider:
        description: The model API, anthropic or openai (any OpenAI-compatible chat completions endpoint).
        type: string
        default: anthropic
      model:
        description: The model that reviews. Empty means claude-sonnet-5-5 for anthropic; openai needs one.
        type: string
        default: ""
      base-url:
        description: The API's base URL, https only, for a gateway or another OpenAI-compatible service. Empty means the provider's own.
        type: string
        default: ""
      max-comments:
        description: The most inline comments one run may post, 1 to 50.
        type: number
        default: 15
      max-input-tokens:
        description: The most prompt tokens one review may use across its turns, cached or not. A run that would go past it stops, and the summary says so.
        type: number
        default: 1000000
      paths-ignore:
        description: Globs, one per line or comma-separated, whose findings and changes are left out (generated code, vendored code).
        type: string
        default: ""
      review-ref:
        description: The wolfproof-review ref whose scripts and prompt run. Empty means the release this workflow file belongs to.
        type: string
        default: ""
    secrets:
      REVIEW_API_KEY:
        description: Your own API key for the provider. Without one, only the scanner summary is posted.
        required: false
      ANTHROPIC_API_KEY:
        description: The older name, still read when the provider is anthropic, base-url is empty and REVIEW_API_KEY is not set.
        required: false

env:
  # The release this file belongs to, and the wolfproof it pins. test/consistency.test.mjs checks
  # both against the plugin's version, the rulebook copy and the `uses:` lines below.
  REVIEW_VERSION: v0.3.4
  WOLFPROOF_VERSION: v1.19.0

jobs:
  scan:
    name: scan
    # pull_request only. pull_request_target would run a fork's code with this repository's secrets.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: wolfproof-review-scan-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install wolfproof's scanners
        id: tooling
        continue-on-error: true
        uses: tjwitko/wolfproof/.github/actions/control-tooling@v1.19.0

      # Blocked and incomplete both fail this step; the review reads the result either way.
      - name: Run wolfproof
        id: gate
        continue-on-error: true
        uses: tjwitko/wolfproof@v1.19.0

      - name: Collect the result and the change
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ steps.gate.outputs.result }}
          OUTCOME: ${{ steps.gate.outputs.outcome }}
          TOOLING: ${{ steps.tooling.outcome }}
        run: |
          out="$RUNNER_TEMP/wolfproof-review-input"
          # Earlier steps ran the pull request's code, which could have left files here.
          rm -rf "$out"
          mkdir -p "$out"
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          # Attributes from an empty tree, so a .gitattributes in the pull request ("*.py -diff",
          # "binary") cannot turn its changes into "Binary files differ". Real binaries still are.
          noattr=$(git hash-object -t tree /dev/null)
          git --attr-source="$noattr" -c core.quotePath=false diff --no-color --no-ext-diff -U0 -M "$base" "$HEAD_SHA" > "$out/diff.patch"
          # One name per NUL, as git has it: no quoting, and a newline can be part of a name.
          git ls-files -z > "$out/files.txt"
          note=""
          if [ -n "$RESULT" ] && [ -f "$RESULT" ]; then
            cp "$RESULT" "$out/result.json"
          else
            note="wolfproof wrote no result (scanner install: $TOOLING). See the scan job's log."
          fi
          jq -n --arg head "$HEAD_SHA" --arg mergeBase "$base" --arg outcome "$OUTCOME" --arg scanNote "$note" \
            --arg wolfproof "$WOLFPROOF_VERSION" --arg reviewVersion "$REVIEW_VERSION" --arg root "$GITHUB_WORKSPACE" \
            '{head: $head, mergeBase: $mergeBase, outcome: $outcome, scanNote: $scanNote, wolfproof: $wolfproof, reviewVersion: $reviewVersion, root: $root}' \
            > "$out/meta.json"
          echo "$(grep -c '^diff --git' "$out/diff.patch") changed file(s); wolfproof outcome: ${OUTCOME:-none}"

      - name: Hand the result to the review job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wolfproof-review-input
          path: ${{ runner.temp }}/wolfproof-review-input
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  review:
    name: review
    needs: scan
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: wolfproof-review-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      IN: .wolfproof-review-input
      CLI: .wolfproof-review/plugins/wolfproof-review/scripts/review.mjs
      PLUGIN: .wolfproof-review/plugins/wolfproof-review
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # The base branch at the root, the pull request in a subdirectory the model is given to read.
      # Nothing from the pull request is executed here.
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check out the pull request, to read
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false

      - name: Check out wolfproof-review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tjwitko/wolfproof-review
          ref: ${{ inputs.review-ref || env.REVIEW_VERSION }}
          path: .wolfproof-review
          persist-credentials: false

      # The model reads files only, through review.mjs's tools, so none of this would be loaded; it
      # is removed so that what the model can read is the pull request's own files.
      - name: Remove configuration the pull request carries
        run: rm -rf pr-head/.git pr-head/.claude pr-head/.claude.json pr-head/.mcp.json

      - name: Download the scan
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wolfproof-review-input
          path: .wolfproof-review-input

      # The scan job ran the pull request's code, so its artifact may carry more than the scan wrote.
      # Keep the four files the scan hands over, as plain files; this job writes everything else.
      - name: Keep only the scan's own files
        run: |
          mkdir -p "$IN"
          find "$IN" -mindepth 1 -maxdepth 1 \( ! -type f -o ! \( -name diff.patch -o -name files.txt -o -name result.json -o -name meta.json \) \) -exec rm -rf {} +
          ls -A "$IN"

      # The change itself, from the pull request's commits, in place of the scan's diff.patch and
      # files.txt: the scan job ran the pull request's code, which could have rewritten them to widen
      # the lines the model may comment on and blind the check of where it commented. This history is
      # outside the folders the model can read, and is removed once the diff is written.
      - name: Check out the pull request's history, for the diff
        if: hashFiles('.wolfproof-review-input/meta.json') != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .wolfproof-review-git
          fetch-depth: 0
          persist-credentials: false

      - name: Compute the change
        if: hashFiles('.wolfproof-review-input/meta.json') != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          d=.wolfproof-review-git
          base=$(git -C "$d" merge-base "$BASE_SHA" "$HEAD_SHA")
          # The scan job's command exactly, attributes from an empty tree included.
          noattr=$(git -C "$d" hash-object -t tree /dev/null)
          git -C "$d" --attr-source="$noattr" -c core.quotePath=false diff --no-color --no-ext-diff -U0 -M "$base" "$HEAD_SHA" > "$RUNNER_TEMP/diff.patch"
          git -C "$d" ls-files -z > "$RUNNER_TEMP/files.txt"
          rm -rf "$d"
          mismatch=false
          if ! cmp -s "$RUNNER_TEMP/diff.patch" "$IN/diff.patch"; then
            mismatch=true
            echo "::warning::The scan job's diff does not match the pull request's commits. This review uses the diff it computed itself."
          fi
          mv "$RUNNER_TEMP/diff.patch" "$IN/diff.patch"
          mv "$RUNNER_TEMP/files.txt" "$IN/files.txt"
          jq --arg head "$HEAD_SHA" --arg mergeBase "$base" --argjson mismatch "$mismatch" \
            '.head = $head | .mergeBase = $mergeBase | .diffMismatch = $mismatch' "$IN/meta.json" > "$RUNNER_TEMP/meta.json"
          mv "$RUNNER_TEMP/meta.json" "$IN/meta.json"
          echo "$(grep -c '^diff --git' "$IN/diff.patch") changed file(s), merge base ${base:0:7}"

      - name: Sort the findings by what the pull request touched
        env:
          IGNORE: ${{ inputs.paths-ignore }}
        run: |
          mkdir -p "$IN"
          if [ ! -f "$IN/diff.patch" ] || [ ! -f "$IN/meta.json" ]; then
            echo "::warning::The scan job left nothing to review."
            exit 0
          fi
          args=()
          [ -f "$IN/result.json" ] && args+=(--result "$IN/result.json")
          node "$CLI" sort "${args[@]}" --diff "$IN/diff.patch" --files "$IN/files.txt" \
            --root "$(jq -r '.root // ""' "$IN/meta.json")" --ignore "$IGNORE" --meta "$IN/meta.json" --out "$IN/sorted.json"

      - name: Decide whether the model reviews
        id: plan
        env:
          HAS_KEY: ${{ secrets.REVIEW_API_KEY != '' || (inputs.provider == 'anthropic' && inputs.base-url == '' && secrets.ANTHROPIC_API_KEY != '') }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          BASE_URL: ${{ inputs.base-url }}
          MAX: ${{ inputs.max-comments }}
          BUDGET: ${{ inputs.max-input-tokens }}
        run: |
          if [ "$PROVIDER" != anthropic ] && [ "$PROVIDER" != openai ]; then
            echo "::error::provider is anthropic or openai, not \"$PROVIDER\""; exit 1
          fi
          if [ -n "$MODEL" ] && ! [[ "$MODEL" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]*$ ]]; then
            echo "::error::model is a model ID such as claude-sonnet-5-5 or gpt-5.1, not \"$MODEL\""; exit 1
          fi
          if [ -z "$MODEL" ] && [ "$PROVIDER" != anthropic ]; then
            echo "::error::the $PROVIDER provider needs a model"; exit 1
          fi
          if [ -n "$BASE_URL" ] && ! [[ "$BASE_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::base-url is an https:// URL"; exit 1
          fi
          if ! [[ "$MAX" =~ ^[0-9]+$ ]] || [ "$MAX" -lt 1 ] || [ "$MAX" -gt 50 ]; then
            echo "::error::max-comments is a number from 1 to 50, not \"$MAX\""; exit 1
          fi
          if ! [[ "$BUDGET" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::max-input-tokens is a whole number of tokens, not \"$BUDGET\""; exit 1
          fi
          if [ ! -f "$IN/sorted.json" ]; then status=no-scan
          elif [ "$FORK" = "true" ]; then status=fork
          elif [ "$HAS_KEY" != "true" ]; then status=no-key
          else status=run
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "since=$(date -u -d '-10 seconds' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Review: $status"

      - name: List earlier review comments
        if: steps.plan.outputs.status == 'run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$CLI" existing --out "$IN/existing.json"

      - name: Build the prompt
        id: prompt
        if: steps.plan.outputs.status == 'run'
        env:
          MAX: ${{ inputs.max-comments }}
        run: |
          node "$CLI" prompt --agent "$PLUGIN/agents/wolfproof-reviewer.md" --sorted "$IN/sorted.json" \
            --diff "$IN/diff.patch" --code-dir pr-head --rulebook "$PLUGIN/rulebook/checks.md" \
            --existing "$IN/existing.json" --max-comments "$MAX" --out "$IN/prompt.md"

      # The model's review, as plain API calls from review.mjs (agent.mjs and providers.mjs). Its only
      # tools are read_file, grep and glob, inside pr-head, the scan's files and the rulebook, and
      # create_inline_comment, which refuses lines the pull request did not add or modify. No shell, no
      # edits, no network: a pull request that carries instructions for it has nothing to run them
      # with. The key is in this step's environment and no other.
      - name: Review
        id: review
        if: steps.plan.outputs.status == 'run'
        continue-on-error: true
        timeout-minutes: 25
        env:
          # The Anthropic key goes only to Anthropic's own API, never to a base-url gateway.
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY || (inputs.provider == 'anthropic' && inputs.base-url == '' && secrets.ANTHROPIC_API_KEY) || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          BASE_URL: ${{ inputs.base-url }}
          MAX: ${{ inputs.max-comments }}
          BUDGET: ${{ inputs.max-input-tokens }}
        run: |
          node "$CLI" run --provider "$PROVIDER" --model "$MODEL" --base-url "$BASE_URL" --prompt "$IN/prompt.md" \
            --code-dir pr-head --input-dir "$IN" --rulebook-dir "$PLUGIN/rulebook" --diff "$IN/diff.patch" \
            --max-comments "$MAX" --max-input-tokens "$BUDGET" --head "$HEAD_SHA" --out "$IN/run.json"

      - name: Check where the comments landed
        if: ${{ !cancelled() && steps.plan.outputs.status == 'run' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SINCE: ${{ steps.plan.outputs.since }}
        run: node "$CLI" check --diff "$IN/diff.patch" --since "$SINCE" --out "$IN/check.json"

      - name: Post the summary
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.plan.outputs.status }}
        run: |
          # run.json, when the review wrote one, says how it went; without it a review that should have
          # run failed.
          case "$STATUS" in
            run) status=failed ;;
            "") status=no-scan ;;
            *) status="$STATUS" ;;
          esac
          args=()
          if [ "$STATUS" = run ]; then
            [ -f "$IN/run.json" ] && args+=(--run "$IN/run.json")
            [ -f "$IN/check.json" ] && args+=(--check "$IN/check.json")
          fi
          [ -f "$IN/sorted.json" ] && args+=(--sorted "$IN/sorted.json") || args+=(--sorted /dev/null)
          node "$CLI" summary "${args[@]}" --status "$status" --post
