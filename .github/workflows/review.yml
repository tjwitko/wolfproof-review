name: wolfproof review

# A comment-only review of a pull request: wolfproof scans the repository, a script sorts its findings
# by whether the pull request touched them, and Claude comments on the lines the pull request changed.
# It never fails the build. Call it from a workflow of your own (see the README):
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#   permissions:
#     contents: read
#     pull-requests: write
#   jobs:
#     wolfproof-review:
#       uses: tjwitko/wolfproof-review/.github/workflows/review.yml@v0.2.1
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#
# Two jobs, so the job that runs the project's code never holds the API key. `scan` runs wolfproof,
# which runs the project's tests and builds, with no secrets and a read-only token. `review` runs no
# project code: it reads the pull request as files, and Claude may only read, search and comment.

on:
  workflow_call:
    inputs:
      model:
        description: The Claude model that reviews.
        type: string
        default: claude-sonnet-5-5
      max-comments:
        description: The most inline comments one run may post, 1 to 50.
        type: number
        default: 15
      paths-ignore:
        description: Globs, one per line or comma-separated, whose findings and changes are left out (generated code, vendored code).
        type: string
        default: ""
      review-ref:
        description: The wolfproof-review ref whose scripts and prompt run. Empty means the release this workflow file belongs to.
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        description: Your own Anthropic API key. Without it, only the scanner summary is posted.
        required: false

env:
  # The release this file belongs to, and the wolfproof it pins. test/consistency.test.mjs checks
  # both against the plugin's version, the rulebook copy and the `uses:` lines below.
  REVIEW_VERSION: v0.2.1
  WOLFPROOF_VERSION: v1.15.0

jobs:
  scan:
    name: scan
    # pull_request only. pull_request_target would run a fork's code with this repository's secrets.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: wolfproof-review-scan-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install wolfproof's scanners
        id: tooling
        continue-on-error: true
        uses: tjwitko/wolfproof/.github/actions/control-tooling@v1.15.0

      # Blocked and incomplete both fail this step; the review reads the result either way.
      - name: Run wolfproof
        id: gate
        continue-on-error: true
        uses: tjwitko/wolfproof@v1.15.0

      - name: Collect the result and the change
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ steps.gate.outputs.result }}
          OUTCOME: ${{ steps.gate.outputs.outcome }}
          TOOLING: ${{ steps.tooling.outcome }}
        run: |
          out="$RUNNER_TEMP/wolfproof-review-input"
          mkdir -p "$out"
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git -c core.quotePath=false diff --no-color --no-ext-diff -U0 -M "$base" "$HEAD_SHA" > "$out/diff.patch"
          git -c core.quotePath=false ls-files > "$out/files.txt"
          note=""
          if [ -n "$RESULT" ] && [ -f "$RESULT" ]; then
            cp "$RESULT" "$out/result.json"
          else
            note="wolfproof wrote no result (scanner install: $TOOLING). See the scan job's log."
          fi
          jq -n --arg head "$HEAD_SHA" --arg mergeBase "$base" --arg outcome "$OUTCOME" --arg scanNote "$note" \
            --arg wolfproof "$WOLFPROOF_VERSION" --arg reviewVersion "$REVIEW_VERSION" --arg root "$GITHUB_WORKSPACE" \
            '{head: $head, mergeBase: $mergeBase, outcome: $outcome, scanNote: $scanNote, wolfproof: $wolfproof, reviewVersion: $reviewVersion, root: $root}' \
            > "$out/meta.json"
          echo "$(grep -c '^diff --git' "$out/diff.patch") changed file(s); wolfproof outcome: ${OUTCOME:-none}"

      - name: Hand the result to the review job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wolfproof-review-input
          path: ${{ runner.temp }}/wolfproof-review-input
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  review:
    name: review
    needs: scan
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: wolfproof-review-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      IN: .wolfproof-review-input
      CLI: .wolfproof-review/plugins/wolfproof-review/scripts/review.mjs
      PLUGIN: .wolfproof-review/plugins/wolfproof-review
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # claude-code-action's advice for pull requests: the base branch at the root, the pull request
      # in a subdirectory Claude is given to read. Nothing from the pull request is executed here.
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check out the pull request, to read
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false

      - name: Check out wolfproof-review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tjwitko/wolfproof-review
          ref: ${{ inputs.review-ref || env.REVIEW_VERSION }}
          path: .wolfproof-review
          persist-credentials: false

      # The pull request's own Claude configuration is not loaded from a subdirectory, but nothing
      # in it is needed either.
      - name: Remove configuration the pull request carries
        run: rm -rf pr-head/.git pr-head/.claude pr-head/.claude.json pr-head/.mcp.json

      - name: Download the scan
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wolfproof-review-input
          path: .wolfproof-review-input

      - name: Sort the findings by what the pull request touched
        env:
          IGNORE: ${{ inputs.paths-ignore }}
        run: |
          mkdir -p "$IN"
          if [ ! -f "$IN/diff.patch" ] || [ ! -f "$IN/meta.json" ]; then
            echo "::warning::The scan job left nothing to review."
            exit 0
          fi
          args=()
          [ -f "$IN/result.json" ] && args+=(--result "$IN/result.json")
          node "$CLI" sort "${args[@]}" --diff "$IN/diff.patch" --files "$IN/files.txt" \
            --root "$(jq -r '.root // ""' "$IN/meta.json")" --ignore "$IGNORE" --meta "$IN/meta.json" --out "$IN/sorted.json"

      - name: Decide whether Claude reviews
        id: plan
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          MODEL: ${{ inputs.model }}
          MAX: ${{ inputs.max-comments }}
        run: |
          if ! [[ "$MODEL" =~ ^[a-z0-9][a-z0-9.-]*$ ]]; then
            echo "::error::model is a model ID such as claude-sonnet-5-5, not \"$MODEL\""; exit 1
          fi
          if ! [[ "$MAX" =~ ^[0-9]+$ ]] || [ "$MAX" -lt 1 ] || [ "$MAX" -gt 50 ]; then
            echo "::error::max-comments is a number from 1 to 50, not \"$MAX\""; exit 1
          fi
          if [ ! -f "$IN/sorted.json" ]; then status=no-scan
          elif [ "$FORK" = "true" ]; then status=fork
          elif [ "$HAS_KEY" != "true" ]; then status=no-key
          else status=run
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "since=$(date -u -d '-10 seconds' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Claude: $status"

      - name: List earlier review comments
        if: steps.plan.outputs.status == 'run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$CLI" existing --out "$IN/existing.json"

      - name: Build the prompt
        id: prompt
        if: steps.plan.outputs.status == 'run'
        env:
          MAX: ${{ inputs.max-comments }}
        run: |
          node "$CLI" prompt --agent "$PLUGIN/agents/wolfproof-reviewer.md" --sorted "$IN/sorted.json" \
            --diff "$IN/diff.patch" --code-dir pr-head --rulebook "$PLUGIN/rulebook/checks.md" \
            --existing "$IN/existing.json" --max-comments "$MAX" --github-output text

      # Claude may read, search and comment inline. No shell, no edits, no network: a pull request
      # that carries instructions for it has nothing to run them with.
      - name: Review with Claude
        id: claude
        if: steps.plan.outputs.status == 'run'
        continue-on-error: true
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          classify_inline_comments: "false"
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model ${{ inputs.model }}
            --max-turns 60
            --add-dir pr-head .wolfproof-review-input .wolfproof-review/plugins/wolfproof-review/rulebook
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch,Task"

      - name: Check where Claude commented
        if: ${{ !cancelled() && steps.plan.outputs.status == 'run' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SINCE: ${{ steps.plan.outputs.since }}
        run: node "$CLI" check --diff "$IN/diff.patch" --since "$SINCE" --out "$IN/check.json"

      - name: Post the summary
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.plan.outputs.status }}
          CLAUDE: ${{ steps.claude.outcome }}
        run: |
          case "$STATUS" in
            run) if [ "$CLAUDE" = success ]; then claude=ran; else claude=failed; fi ;;
            "") claude=no-scan ;;
            *) claude="$STATUS" ;;
          esac
          args=()
          [ -f "$IN/check.json" ] && args+=(--check "$IN/check.json")
          [ -f "$IN/sorted.json" ] && args+=(--sorted "$IN/sorted.json") || args+=(--sorted /dev/null)
          node "$CLI" summary "${args[@]}" --claude "$claude" --post
