name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test 'test/*.test.mjs'

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  # The rulebook is a copy of wolfproof's docs/checks.md at the tag the review workflow pins.
  rulebook:
    name: rulebook
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare with wolfproof's checks.md at the pinned tag
        run: |
          src=plugins/wolfproof-review/rulebook/SOURCE.json
          url="https://raw.githubusercontent.com/$(jq -r .repository "$src")/$(jq -r .tag "$src")/$(jq -r .path "$src")"
          curl -fsSL "$url" -o upstream.md
          if ! diff -q upstream.md plugins/wolfproof-review/rulebook/checks.md >/dev/null; then
            echo "::error::rulebook/checks.md differs from $url. Copy it again."
            exit 1
          fi
          echo "rulebook matches $url"
